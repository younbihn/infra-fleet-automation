---
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: lab

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["192.168.64.2:9100"]
        labels: { host: lab01, tier: web }
      - targets: ["192.168.64.3:9100"]
        labels: { host: lab02, tier: web }
      - targets: ["192.168.64.4:9100"]
        labels: { host: app01, tier: app }
      - targets: ["192.168.64.5:9100"]
        labels: { host: db01, tier: db }
      - targets: ["192.168.64.7:9100"]
        labels: { host: lb01, tier: lb }

  - job_name: nginx
    static_configs:
      - targets: ["192.168.64.2:9113"]
        labels: { host: lab01, tier: web }
      - targets: ["192.168.64.3:9113"]
        labels: { host: lab02, tier: web }

  - job_name: first-come-api
    metrics_path: /metrics
    static_configs:
      - targets: ["192.168.64.4:8000"]
        labels: { host: app01, tier: app }
