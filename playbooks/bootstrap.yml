---
- name: 서버 초기 구성
  hosts: webservers
  become: yes

  vars:
    deploy_user: deploy
    admin_pubkey: "{{ lookup('file', '~/.ssh/id_ecdsa.pub') }}"
    clock_drift_threshold: 5

  tasks:
    - name: deploy 계정 생성
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        create_home: yes
        state: present
      tags: [account]

    - name: deploy SSH 공개키 등록
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ admin_pubkey }}"
        state: present
      tags: [account, ssh]

    - name: sudoers 규칙 배포 (systemctl만 허용)
      ansible.builtin.copy:
        dest: /etc/sudoers.d/deploy
        content: "deploy ALL=(ALL) NOPASSWD: /usr/bin/systemctl\n"
        owner: root
        group: root
        mode: '0440'
        validate: 'visudo -cf %s'
      tags: [account, sudo]

    - name: chronyd 실행 및 부팅 시 자동 시작
      ansible.builtin.systemd:
        name: chronyd
        state: started
        enabled: yes
      tags: [time]

    - name: 컨트롤 노드와의 시각 오차 계산
      ansible.builtin.set_fact:
        clock_drift_sec: >-
          {{ ((ansible_facts.date_time.epoch | int)
              - (lookup('pipe', 'date +%s') | int)) | abs }}
      tags: [time]

    - name: 시각 오차 보고
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: 오차 {{ clock_drift_sec }}초"
      tags: [time]

    - name: 시각 즉시 보정 (오차 임계치 초과 시에만)
      ansible.builtin.command: chronyc makestep
      when: clock_drift_sec | int > clock_drift_threshold
      tags: [time]

    - name: 시스템 시각을 하드웨어 시계에 반영 (보정했을 때만)
      ansible.builtin.command: hwclock --systohc
      when: clock_drift_sec | int > clock_drift_threshold
      tags: [time]

    - name: 방화벽에 ssh 허용
      ansible.posix.firewalld:
        service: ssh
        permanent: yes
        immediate: yes
        state: enabled
      tags: [firewall]
